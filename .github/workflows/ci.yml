name: GaoApp CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
      - integration/r1-ci-windows-runner

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable source revision
        shell: pwsh
        env:
          GAOAPP_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actualSourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSourceSha -ne $env:GAOAPP_EXPECTED_SOURCE_SHA) {
            throw "Checked out source does not match the expected immutable commit."
          }
          Write-Host "Verified source commit: $actualSourceSha"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked browser test dependencies
        working-directory: GaoApp.Tests.Browser
        run: npm ci

      - name: Verify required Chrome browser channel
        working-directory: GaoApp.Tests.Browser
        shell: pwsh
        run: |
          $chromeProbe = "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch({channel:'chrome',headless:true});await b.close();})().catch(()=>process.exit(1));"
          & node -e $chromeProbe
          if ($LASTEXITCODE -ne 0) {
            & npx playwright install chrome
            if ($LASTEXITCODE -ne 0) { throw "Required Chrome installation failed." }
            & node -e $chromeProbe
            if ($LASTEXITCODE -ne 0) { throw "Required Chrome channel is unavailable." }
          }

      - name: Restore dependencies
        run: dotnet restore GaoApp.sln

      - name: Build solution
        run: dotnet build GaoApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GaoApp.Tests/GaoApp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=gaoapp-tests.trx"

      - name: Run browser script security and payment regression tests
        run: node --test GaoApp.Tests/Ui/*.test.cjs

      - name: Publish and verify paired staging release
        shell: pwsh
        run: |
          $releaseOutput = @(./scripts/publish-staging-release.ps1)
          $releasePath = $releaseOutput[-1]
          "GAOAPP_TEST_RELEASE=$releasePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify deployment tools reject unsafe configuration
        shell: pwsh
        run: ./scripts/test-deployment-tools.ps1 -ReleasePath $env:GAOAPP_TEST_RELEASE

      - name: Test published Production configuration and HTTPS login
        shell: pwsh
        run: ./scripts/test-published-production.ps1 -ReleasePath $env:GAOAPP_TEST_RELEASE -ArtifactsPath Logs/security-phase6-build
