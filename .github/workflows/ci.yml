name: GaoApp CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
      - integration/r1-ci-windows-runner

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore GaoApp.sln

      - name: Build solution
        run: dotnet build GaoApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GaoApp.Tests/GaoApp.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=gaoapp-tests.trx"

      - name: Run browser script security and payment regression tests
        run: node --test GaoApp.Tests/Ui/*.test.cjs

      - name: Publish and verify paired staging release
        shell: pwsh
        run: |
          $releaseOutput = @(./scripts/publish-staging-release.ps1)
          $releasePath = $releaseOutput[-1]
          "GAOAPP_TEST_RELEASE=$releasePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify deployment tools reject unsafe configuration
        shell: pwsh
        run: ./scripts/test-deployment-tools.ps1 -ReleasePath $env:GAOAPP_TEST_RELEASE

      - name: Test published Production configuration and HTTPS login
        shell: pwsh
        run: ./scripts/test-published-production.ps1 -ReleasePath $env:GAOAPP_TEST_RELEASE -ArtifactsPath Logs/security-phase6-build
